<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EMSA</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>EMSA</h2>
            <p class="subtitle">Sistema de Gestión de Residuos</p>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tucorreo@gmail.com">

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">

            <div id="error-msg" class="error-msg"></div>

            <button id="login-btn" class="login-btn">Ingresar</button>

            <div class="register-link">
                ¿No tienes cuenta? <a href="Register_Users.html">Regístrate aquí</a>
            </div>
        </div>
    </div>
    <script type="module" src="../functions/Users/User.Login.presenter.js"></script>
</body>
</html>
