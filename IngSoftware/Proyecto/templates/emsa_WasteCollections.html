<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSA Services - Admin</title>

    <!-- 1. Agregamos el CSS base y el CSS modular del Sidebar de EMSA -->
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/emsa_sidebar.css">
    
    <!-- Estilos específicos de esta vista -->
    <link rel="stylesheet" href="../styles/emsa_services.css">

    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<div class="main-layout">

    <!-- 2. AQUÍ SE INYECTA EL SIDEBAR DE EMSA -->
    <div id="sidebar-container"></div>

    <!-- 3. CONTENT: Todo tu contenido original queda intacto -->
    <main class="content-area">

        <header class="main-header">
            <h1 class="titulo">EMSA Services</h1>
            <p class="subtitle">Manage registered collection services</p>
        </header>

        <!-- FILTER BAR -->
        <section class="filter-bar">

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search rutas">
            </div>

            <select id="filter-distrito">
                <option value="">Distrito</option>
                <option value="2">Distrito 2</option>
                <option value="6">Distrito 6</option>
                <option value="7">Distrito 7</option>
                <option value="8">Distrito 8</option>
                <option value="9">Distrito 9</option>
                <option value="15">Distrito 15</option>
            </select>

            <select id="filter-zona">
                <option value="">Zona</option>
            </select>

            <select id="filter-dia">
                <option value="">Día</option>
                <option value="lunes">Lunes</option>
                <option value="martes">Martes</option>
                <option value="miércoles">Miércoles</option>
                <option value="jueves">Jueves</option>
                <option value="viernes">Viernes</option>
                <option value="sábado">Sábado</option>
                <option value="domingo">Domingo</option>
            </select>

            <button type="button" class="search-btn">
                <i class="fas fa-search"></i>
            </button>

            <button type="button" class="clear-btn" id="clear-filters">
                Limpiar
            </button>

        </section>

        <!-- CARDS -->
        <section class="results">
            <div id="grid-cards" class="grid-cards"></div>
        </section>

    </main>

</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal large-modal">
        <h2>Edit Service</h2>
        <div class="modal-form">
            <div class="input-group">
                <label>Distrito</label>
                <select id="edit-distrito">
                    <option value="2">Distrito 2</option>
                    <option value="6">Distrito 6</option>
                    <option value="7">Distrito 7</option>
                    <option value="8">Distrito 8</option>
                    <option value="9">Distrito 9</option>
                    <option value="15">Distrito 15</option>
                </select>
            </div>
            <div class="input-group">
                <label>Zona</label>
                <select id="edit-zona">
                    <option value="">Zona</option>
                </select>
            </div>
            <div class="input-group">
                <label>Día</label>
                <select id="edit-dia">
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miércoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Sábado">Sábado</option>
                    <option value="Domingo">Domingo</option>
                </select>
            </div>
            <div class="input-group">
                <label>Horario</label>
                <input type="text" id="edit-horario">
            </div>
            <div class="input-group">
                <label>Status</label>
                <select id="edit-status">
                    <option value="available">Available</option>
                    <option value="unavailable">Unavailable</option>
                </select>
            </div>
            <div class="input-group">
                <label>Rutas</label>
                <textarea id="edit-rutas"></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="cancel-btn" id="cancel-edit">Cancel</button>
            <button class="save-btn" id="save-edit">Save Changes</button>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="delete-modal">
    <div class="modal">
        <h2>Delete Service</h2>
        <p>Are you sure you want to delete this service?</p>
        <div class="modal-actions">
            <button class="cancel-btn" id="cancel-delete">Cancel</button>
            <button class="delete-btn-modal" id="confirm-delete">Delete</button>
        </div>
    </div>
</div>

<!-- 4. Llamamos al script que inyecta el sidebar y resalta "Services List" -->
<script type="module">
    // ¡RUTA CORREGIDA AQUÍ!
    import { loadSidebar } from '../utils/sidebar_loader.js';
    loadSidebar('emsa', 'menu-emsa-services');
</script>

<script type="module" src="../functions/EMSA/Emsa.WasteCollections.presenter.js"></script>

</body>
</html>
