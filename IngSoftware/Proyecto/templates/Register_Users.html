<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EMSA</title>
    <link rel="stylesheet" href="../styles/Register_Users.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <h2>EMSA</h2>
            <p class="subtitle">Crear cuenta nueva</p>

            <form id="registerForm">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" placeholder="Tu nombre">

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@correo.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">

                <label for="role">Rol</label>
                <select id="role">
                    <option value="">Seleccionar rol</option>
                    <option value="citizen">Ciudadano</option>
                    <option value="emsa">EMSA</option>
                </select>

                <div id="keyContainer" class="hidden">
                    <label for="key">Llave EMSA</label>
                    <input type="text" id="key" placeholder="Ingresa la llave EMSA">
                </div>

                <p id="messageBox" class="message-box"></p>

                <button type="submit" class="register-btn">Crear cuenta</button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
    <script type="module" src="../functions/Users/User.Register.presenter.js"></script>
</body>
</html>
